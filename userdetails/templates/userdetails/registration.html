<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        
        *{
            margin:0;
            padding : 0;
            box-sizing: border-box;
        }

        body{
            background: linear-gradient(135deg , #667eea ,#764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container{
            width:50%;
         
        }

        .registration-card{
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);

        }

        .registration-card h2{
            text-align: center;
            color: #333;
            font-size: 26px;
            margin-bottom: 10px;
        }

        .registration-card p{
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        form label{
            display:block;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        form input{
            display:block;
            width:100%;
            padding:12px;
            margin-bottom:20px;
            border:1px solid #cccccccc;
            border-radius: 10px;
            font-size: 15px;
            background: white;
            color: #333;
            outline: none;
            transition: 0.3s;
        }

        button{
            border-radius: 5px;
            border:1px solid #565252cc;
            padding:5px;
            
        }

    </style>
</head>
<body>
    
    <!-- <marquee>
        <hi>This is registration Page..</hi>
    </marquee> -->

    <hr>

    <div class="container">

        <div class="registration-card">
            <h2>Create Account</h2>
            <p>Register your user here!</p>

        <form method="POST">
        {% csrf_token %}
        <label>Full Name</label>
         <input type="text" placeholder="Enter FullName" name="fullname">

         <label>Contact No</label>
         <input type="text" placeholder="Enter Contact No" name="mobileno">

         <label>Email Id / UserName</label>
         <input type="text" placeholder="Enter Email Id" name="username">

         <label>Password</label>
         <input type="text" placeholder="Enter Password" name="password">

         <button type="submit">Register</button>

        </form>
        </div>
    </div>
    
</body>
</html>
